<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Mamma Calories weekly meal planner</title>
  <desc id="desc">Restaurant-branded Plan and Build interface showing nutrition guidance, meal cards, a weekly plan, macro totals, and prices.</desc>
  <rect width="1440" height="900" fill="#f8f4ed"/>
  <rect width="1440" height="88" fill="#fffdf9"/>
