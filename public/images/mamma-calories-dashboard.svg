  <text x="132" y="158" fill="#173c2e" font-family="Arial, sans-serif" font-size="18" font-weight="700">Nutrition data you can inspect</text>
  <text x="132" y="190" fill="#52665b" font-family="Arial, sans-serif" font-size="14">Every meal shows its portion, calories and macro estimate. Review the details and sources before adding it to your week.</text>
  <text x="132" y="214" fill="#738077" font-family="Arial, sans-serif" font-size="12">No account needed to start planning.</text>

  <text x="56" y="292" fill="#173c2e" font-family="Georgia, serif" font-size="34" font-weight="700">Plan your week</text>
  <text x="56" y="323" fill="#6d766f" font-family="Arial, sans-serif" font-size="14">Choose kitchen-prepared meals and compare your plan with your nutrition targets.</text>

