  <text x="512" y="53" fill="#173c2e" font-family="Arial, sans-serif" font-size="15" font-weight="700">PLAN &amp; BUILD</text>
  <text x="680" y="53" fill="#69766f" font-family="Arial, sans-serif" font-size="15">HOW IT WORKS</text>
  <text x="832" y="53" fill="#69766f" font-family="Arial, sans-serif" font-size="15">OUR KITCHEN</text>
  <rect x="1235" y="25" width="141" height="40" rx="20" fill="#173c2e"/>
  <text x="1261" y="51" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">START PLANNING</text>

